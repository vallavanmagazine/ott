name: Build Flutter APK

on:
  push:
    branches: [flutter-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-app

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Must ship Dart >= 3.6.0 — pubspec.lock resolves against Dart >=3.6.0
          # (Flutter 3.24.0 bundles Dart 3.5.x and fails `flutter pub get`).
          flutter-version: '3.27.3'
          channel: 'stable'
          cache: true

      # On the flutter-app branch the Flutter project is at the repo root
      # (no flutter_app/ subdirectory), so no working-directory is set here.
      - name: Get dependencies
        run: flutter pub get

      # Unset secrets resolve to an empty string, which the app treats as
      # "feature not configured" (Env.*Configured) rather than failing the
      # build: payments and SMS OTP then degrade to their disabled states.
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define="RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
            --dart-define="FAST2SMS_KEY=${{ secrets.FAST2SMS_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vallavan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
