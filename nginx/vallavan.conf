# Vallavan nginx vhosts — domain split.
#
#   app.vallavan.in        -> the Vite SPA (static)  + /api/ proxied to NestJS :3011
#   vallavan.in / www.     -> seo-site (Next.js SSR) proxied to :3002
#
# NOT YET DEPLOYED. This is the repo's copy; the live config on the VPS still
# serves the SPA from the root domain. See the notes below before rolling out.
#
# TLS: there is deliberately no ssl_certificate / listen 443 here. Cloudflare
# terminates HTTPS and connects back to the origin over plain HTTP on port 80
# ("SSL: Flexible" — see COMPLETE_PROJECT_DISPATCH.md:16). Adding certbot certs
# here would not be used by anything. app.vallavan.in therefore needs a
# *Cloudflare DNS record*, not a Let's Encrypt certificate, before it will
# serve traffic.
#
# Ports on this shared VPS. The backend container listens on 3001 internally
# (backend/src/main.ts default) but is published on HOST port 3011, because
# 3001 already belongs to another client's app (mr-travels-backend); the run
# command maps 3011->3001. See backend/Dockerfile.
#   3011 = vallavan backend (host) -> 3001 (container)
#   3002 = seo-site. Next has no port in seo-site/next.config.js so it defaults
#          to 3000 — which is also taken on this box — and must therefore be
#          started explicitly with PORT=3002.
# Ports known to be occupied by other projects: 3000, 3001, 3006, 3008, 3010.

# ---------------------------------------------------------------------------
# app.vallavan.in — the SPA, plus the backend API it calls
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name app.vallavan.in;

    # Unchanged from the previous single-vhost config. The SPA keeps this
    # docroot: seo-site is reverse-proxied to a Node process and never reads
    # from the filesystem, so it does not contend for /var/www/vallavan and no
    # files need to move on the VPS.
    root /var/www/vallavan;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The backend the SPA talks to (VITE_API_BASE_URL). Without this block a
    # request to /api/... falls through to the SPA catch-all below and returns
    # index.html with HTTP 200 — which is exactly the failure seen in
    # production today: the browser gets HTML where it expects JSON.
    #
    # Must be declared before `location /`, and the trailing slash on both
    # sides is load-bearing: it maps /api/foo -> :3011/api/foo, matching the
    # global 'api' prefix set in backend/src/main.ts.
    location /api/ {
        proxy_pass http://localhost:3011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Admin video uploads go browser -> Bunny directly, so nothing large
        # passes through here; these just stop a slow backend call from being
        # cut off mid-flight.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}

# ---------------------------------------------------------------------------
# vallavan.in + www — seo-site (Next.js SSR), the crawlable public layer
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name vallavan.in www.vallavan.in;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Everything is handled by Next.js, including /documentaries/[id],
    # /genre/[genre], /sitemap.xml and /robots.txt — all of which currently
    # return the SPA's index.html because no such process is running yet.
    #
    # No `root` and no try_files: a static fallback here would silently mask a
    # dead Next process by serving stale SPA files under the root domain.
    location / {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js streams responses; HTTP/1.1 keeps that working through nginx.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # The embed widget is the one route that MUST be framable by other sites —
    # that is its entire purpose. The SAMEORIGIN header above would block it in
    # every third-party iframe, and add_header does not inherit into a location
    # that declares its own, so this block restates the headers it does want and
    # swaps in frame-ancestors instead. Nothing else on the origin becomes
    # framable; only /embed/.
    location /embed/ {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # Next.js emits content-hashed filenames under /_next/static, so these are
    # safe to cache hard. Bypasses the proxy_cache_bypass rules above.
    location /_next/static/ {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
