name: vallavan_app
description: "Vallavan — Tamil-first documentary OTT (mobile)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  supabase_flutter: ^2.5.6
  video_player: ^2.8.6         # native HLS (ExoPlayer/AVPlayer) — replaces hls_player
  chewie: ^1.7.5
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  go_router: ^13.2.4
  flutter_riverpod: ^2.5.1
  geolocator: ^11.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.3
  http: ^1.2.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
